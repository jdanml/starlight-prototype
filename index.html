<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c1e" />
    <meta name="description" content="A tiny original side-scrolling action game." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oxanium:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Starline: Relay Run</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="identity">
          <p class="eyebrow">BDXIO / PLAYABLE STUDY 01</p>
          <h1>STARLINE <span>RELAY RUN</span></h1>
        </div>
        <p class="sector-tag"><span class="signal-dot"></span> SECTOR 01 / THE GLASSWORKS</p>
      </header>

      <section class="game-shell" aria-label="Starline Relay Run game">
        <div id="game"></div>
      </section>

      <footer class="game-footer">
        <p class="key-guide">
          <span><kbd>←</kbd><kbd>→</kbd> MOVE</span>
          <span><kbd>SPACE</kbd> JUMP</span>
          <span><kbd>X</kbd> FIRE</span>
          <span><kbd>R</kbd> REBOOT</span>
        </p>
        <div class="touch-controls" aria-label="Touch controls">
          <button type="button" data-control="left" aria-label="Move left">←</button>
          <button type="button" data-control="right" aria-label="Move right">→</button>
          <button type="button" data-control="jump" aria-label="Jump">↑</button>
          <button type="button" data-control="fire" aria-label="Fire">✦</button>
        </div>
        <p class="build-tag">PROTOTYPE 0.1 <span>◆</span> ORIGINAL PIXEL STUDY</p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
